[project]
name = "rflux"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ibrahim Abdulrasheed", email = "iabdulrasheed919@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.1",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rflux = "rflux:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
