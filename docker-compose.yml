version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rflux-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rflux
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rflux-network
  
  redis:
    image: redis:7-alpine
    container_name: rflux-redis
    restart: always
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    networks:
      - rflux-network

volumes:
  postgres_data:
  redis_data:

networks:
  rflux-network:
    driver: bridge