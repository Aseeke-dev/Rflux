services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rflux-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-rflux_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rflux-network
  
  redis:
    image: redis:7-alpine
    container_name: rflux-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - rflux-network

volumes:
  postgres_data:
  redis_data:

networks:
  rflux-network:
    driver: bridge